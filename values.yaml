namespace: rhai-namespace

image:
  repository: registry.redhat.io/rhaiis/vllm-cuda-rhel9
  tag: 3.3
  pullPolicy: IfNotPresent

model:
  ociImage: "registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct-fp8-dynamic:1.5"
  name: llama3
  tensor_parallel_size: 1
  too_call_parser: llama3_json
  max_model_len: 16000

resources:
  limits:
    cpu: "10"
    memory: 16Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 6Gi
    nvidia.com/gpu: "1"

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8000

route:
  enabled: true

secrets:
  hfSecret: ""
  docker:
    dockercfg: ""