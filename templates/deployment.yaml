apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.model.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.model.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.model.name }}
    spec:
      imagePullSecrets:
        - name: docker-secret
      {{- if eq .Values.model.source "oci" }}
      sharedProcessNamespace: true
      {{- end }}
      volumes:
        - name: model-volume
          {{- if eq .Values.model.source "oci" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: model-cache
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      {{- if eq .Values.model.source "oci" }}
      initContainers:
        - name: model-loader
          image: {{ .Values.model.ociImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying model files to /mnt/models..."
              cp -rp /models/. /mnt/models/
              echo "Done."
          volumeMounts:
            - name: model-volume
              mountPath: /mnt/models
      {{- end }}
      containers:
        - name: {{ .Values.model.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if eq .Values.model.source "huggingface" }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: /model/cache/huggingface
            {{- else }}
            - name: HF_HOME
              value: /tmp/hf
            {{- end }}
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --port={{ .Values.service.port }}
            {{- if eq .Values.model.source "oci" }}
            - --model=/mnt/models
            {{- else }}
            - --model={{ .Values.model.hfRepo }}
            {{- end }}
            - --served-model-name={{ .Values.model.name }}
            - --tensor-parallel-size={{ .Values.model.tensor_parallel_size }}
            - --enable-auto-tool-choice
            - --tool-call-parser={{ .Values.model.too_call_parser }}
            {{- if .Values.model.max_model_len }}
            - --max-model-len={{ .Values.model.max_model_len }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-volume
              {{- if eq .Values.model.source "oci" }}
              mountPath: /mnt/models
              {{- else }}
              mountPath: /model
              {{- end }}
            - name: shm
              mountPath: /dev/shm