apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.model.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.model.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.model.name }}
    spec:
      imagePullSecrets:
        - name: docker-secret
      sharedProcessNamespace: true
      volumes:
        - name: model-volume
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      initContainers:
        - name: model-loader
          image: {{ .Values.model.ociImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying model files to /mnt/models..."
              cp -rp /models/. /mnt/models/
              echo "Done."
          volumeMounts:
            - name: model-volume
              mountPath: /mnt/models
      containers:
        - name: {{ .Values.model.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HF_HOME
              value: /tmp/hf
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --port={{ .Values.service.port }}
            - --model=/mnt/models
            - --served-model-name={{ .Values.model.name }}
            - --tensor-parallel-size={{ .Values.model.tensor_parallel_size }}
            - --enable-auto-tool-choice
            - --tool-call-parser={{ .Values.model.too_call_parser }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-volume
              mountPath: /mnt/models
            - name: shm
              mountPath: /dev/shm