apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.model.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.model.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.model.name }}
    spec:
      imagePullSecrets:
        - name: docker-secret
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      containers:
        - name: {{ .Values.model.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: /model/cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --port={{ .Values.service.port }}
            - --model={{ .Values.model.hfRepo }}
            - --served-model-name={{ .Values.model.name }}
            - --tensor-parallel-size={{ .Values.model.tensor_parallel_size }}
            - --enable-auto-tool-choice
            - --tool-call-parser={{ .Values.model.too_call_parser }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-volume
              mountPath: /model
            - name: shm
              mountPath: /dev/shm